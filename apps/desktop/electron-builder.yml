appId: app.moco.desktop
productName: Moco
directories:
  output: release
  buildResources: resources
# The utility process runs TypeScript source outside node_modules (Node type stripping).
asar: false
files:
  - out/**
  - package.json
  - from: src/main
    to: runtime/apps/desktop/src/main
    filter: [agent-host.ts, service.ts]
  - from: ../../packages/agent/src
    to: runtime/packages/agent/src
extraResources:
  - from: resources/icon.png
    to: icon.png
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.video
linux:
  target: AppImage
  category: Video
