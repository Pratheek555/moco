  <g id="viseme_C"><ellipse cx="200" cy="217" rx="13" ry="7" fill="#4a0f1a" stroke="#7a2232" stroke-width="3"/><path d="M190 213 L210 213" stroke="#fdfaf3" stroke-width="2"/></g>
